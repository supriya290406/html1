<!DOCTYPE html>
<html>
<head>
    <title>Voter Eligibility Checker</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            color: white;
        }

        input {
            width: 90%;
            height: 40px;
            font-size: 18px;
            margin: 10px 0;
            padding: 5px;
        }

        button {
            width: 100%;
            height: 45px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            background: green;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Voter Eligibility Checker</h2>

    <input type="number" id="age" placeholder="Enter your age">

    <button onclick="checkEligibility()">
        Check Eligibility
    </button>

    <div id="result"></div>
</div>

<script>
    function checkEligibility() {
        let age = document.getElementById("age").value;
        let result = document.getElementById("result");

        if (age === "") {
            result.innerHTML = "Please enter your age";
            result.style.color = "yellow";
        } else if (age >= 18) {
            result.innerHTML = "✅ Eligible to Vote";
            result.style.color = "lightgreen";
        } else {
            result.innerHTML = "❌ Not Eligible to Vote";
            result.style.color = "red";
        }
    }
</script>

</body>
</html>
